<!DOCTYPE html>
<html lang="fr"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Chat</title>
<style>
:root{--bg:#f4f1ff;--panel:#fff;--ink:#1d1736;--muted:#7a7396;--line:#e4defa;--accent:#7c3aed;--grad:linear-gradient(135deg,#7c3aed,#ec4899);--theirs:#fff;--side:#1e1b4b;--side-ink:#e0dcff;--nl:38%}
@media(prefers-color-scheme:dark){:root{--bg:#0c0a1d;--panel:#15122b;--ink:#ece9ff;--muted:#9189b8;--line:#2a2450;--accent:#a78bfa;--theirs:#201b40;--side:#110e26;--nl:74%}}
*{box-sizing:border-box}[hidden]{display:none!important}html,body{height:100%;margin:0}
body{font:16px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}
button,input{font:inherit}:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#login{height:100%;display:grid;place-items:center;padding:1rem;background:radial-gradient(circle at 15% 20%,#ec4899 0,transparent 45%),radial-gradient(circle at 85% 80%,#38bdf8 0,transparent 45%),linear-gradient(135deg,#312e81,#7c3aed)}
#login form{background:var(--panel);border-radius:18px;padding:2rem;width:min(380px,100%);box-shadow:0 20px 50px rgba(20,10,60,.4)}
#login h1{margin:0 0 1rem;font-size:1.6rem;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
#login input{width:100%;padding:.75rem .9rem;margin-bottom:.6rem;border:2px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
#login .btns{display:flex;gap:.5rem}#login .btns button{flex:1}#err{color:#e11d48;min-height:1.3em;margin:.2rem 0 .6rem;font-size:.9rem}
.btn{background:var(--grad);color:#fff;border:0;border-radius:10px;padding:.75rem 1.1rem;font-weight:600;cursor:pointer}
.btn.alt{background:var(--bg);color:var(--ink);border:2px solid var(--line)}
#app{height:100%;display:none;grid-template-columns:240px 1fr}
aside{background:var(--side);color:var(--side-ink);padding:1rem;overflow-y:auto;background-image:linear-gradient(180deg,rgba(124,58,237,.35),transparent 35%)}
aside h2{font-size:.95rem;margin:1rem 0 .5rem}aside h2:first-child{margin-top:0}
.room{display:flex;justify-content:space-between;width:100%;background:none;border:0;color:inherit;text-align:left;padding:.45rem .6rem;border-radius:8px;cursor:pointer}
.room:hover{background:rgba(255,255,255,.08)}.room.on{background:rgba(255,255,255,.16);font-weight:600}
.badge{background:#ec4899;color:#fff;border-radius:999px;font-size:.75rem;padding:0 .5rem}
aside ul{list-style:none;margin:0;padding:0}aside li{display:flex;align-items:center;gap:.6rem;padding:.25rem 0}
.av{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.9rem;color:#fff;background:linear-gradient(135deg,hsl(var(--h) 75% 55%),hsl(calc(var(--h) + 40) 75% 45%))}
aside .av{width:26px;height:26px;font-size:.75rem}.me-box{margin-top:1rem;font-size:.85rem;opacity:.8}.me-box button{background:none;border:0;color:inherit;text-decoration:underline;cursor:pointer}
main{display:flex;flex-direction:column;min-width:0;height:100%;background:radial-gradient(circle at 10% 0,rgba(124,58,237,.1),transparent 40%),radial-gradient(circle at 90% 100%,rgba(236,72,153,.1),transparent 40%),var(--bg)}
header{padding:.8rem 1rem;border-bottom:1px solid var(--line);background:var(--panel);font-weight:700}
#messages{flex:1;overflow-y:auto;padding:1rem;display:flex;flex-direction:column;gap:.8rem}
.row{display:flex;gap:.6rem;align-items:flex-end;max-width:min(78%,580px)}.row.me{align-self:flex-end;flex-direction:row-reverse}
.msg{position:relative;padding:.5rem .85rem;border-radius:16px 16px 16px 4px;background:var(--theirs);box-shadow:0 2px 10px rgba(80,50,160,.12);overflow-wrap:anywhere}
.row.me .msg{background:var(--grad);color:#fff;border-radius:16px 16px 4px 16px}
.meta{font-size:.75rem;color:hsl(var(--h) 70% var(--nl));font-weight:600}.meta time{color:var(--muted);font-weight:400;margin-left:.4rem}
.row.me .meta,.row.me .meta time{color:rgba(255,255,255,.8)}
.reacts{display:flex;flex-wrap:wrap;gap:.3rem;margin-top:.3rem}
.chip{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:999px;padding:0 .5rem;cursor:pointer;font-size:.85rem}.chip.on{border-color:var(--accent);background:rgba(124,58,237,.18)}
.acts{display:none;position:absolute;bottom:100%;margin-bottom:2px;right:0;gap:2px;background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:2px 4px;box-shadow:0 4px 14px rgba(20,10,60,.2)}
.row.me .acts{right:auto;left:0}.msg:hover .acts,.msg.open .acts{display:flex}.acts button{background:none;border:0;cursor:pointer;padding:.15rem .25rem;border-radius:6px}.acts button:hover{background:var(--bg)}
#typing{height:1.4rem;padding:0 1rem;font-size:.85rem;color:var(--accent);font-style:italic}
#composer{display:flex;gap:.6rem;padding:.75rem 1rem 1rem;border-top:1px solid var(--line);background:var(--panel)}
#composer input{flex:1;padding:.75rem 1rem;border:2px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink)}#composer input:focus{border-color:var(--accent);outline:none}
@media(max-width:640px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr}aside{padding:.5rem;overflow:auto hidden}aside h2,aside ul,.me-box{display:none}#rooms{display:flex;gap:.3rem}.room{white-space:nowrap;width:auto;gap:.5rem}.row{max-width:90%}}
</style></head><body>
<div id="login"><form id="lf"><h1>Bienvenue 👋</h1>
<input id="n" placeholder="Pseudo" maxlength="20" autocomplete="username" aria-label="Pseudo">
<input id="p" type="password" placeholder="Mot de passe" autocomplete="current-password" aria-label="Mot de passe">
<p id="err" role="alert"></p>
<div class="btns"><button class="btn" value="login">Se connecter</button><button class="btn alt" value="register">Créer un compte</button></div></form></div>
<div id="app"><aside><h2>Salons</h2><div id="rooms"></div><button class="room" id="newRoom">＋ Nouveau salon</button>
<h2>En ligne (<span id="count">0</span>)</h2><ul id="users"></ul>
<div class="me-box"><span id="status">Connecté</span> · <button id="out">Déconnexion</button></div></aside>
<main><header id="title"></header><div id="messages" aria-live="polite"></div><div id="typing"></div>
<form id="composer"><input id="text" maxlength="1000" placeholder="Écrire un message" autocomplete="off" aria-label="Message"><button class="btn">Envoyer</button></form></main></div>
<script>
const $=(s)=>document.querySelector(s);
const h=(t,p={},...k)=>{const e=document.createElement(t);Object.assign(e,p);e.append(...k);return e};
const hue=(n)=>[...n].reduce((a,c)=>(a*31+c.charCodeAt(0))%360,7);
const EMO=["👍","❤️","😂","😮","😢","🎉"];
let ws,me=null,rooms=[],cur=null,store={},unread={},online=[],typeT,lastTyping=0;
const send=(o)=>ws&&ws.readyState===1&&ws.send(JSON.stringify(o));
function connect(){
  ws=new WebSocket((location.protocol==="https:"?"wss":"ws")+"://"+location.host);
  ws.onopen=()=>{const t=localStorage.getItem("token");if(t)send({type:"resume",token:t})};
  ws.onmessage=(e)=>on(JSON.parse(e.data));
  ws.onclose=()=>{$("#status").textContent="Reconnexion…";setTimeout(connect,2000)};
}
function av(n){const a=h("div",{className:"av",textContent:n[0].toUpperCase()});a.style.setProperty("--h",hue(n));return a}
function beep(){try{const a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.frequency.value=660;g.gain.value=.08;o.connect(g);g.connect(a.destination);o.start();o.stop(a.currentTime+.12)}catch{}}
function confetti(){
  if(matchMedia("(prefers-reduced-motion: reduce)").matches)return;
  const c=h("canvas",{width:innerWidth,height:innerHeight});c.style.cssText="position:fixed;inset:0;pointer-events:none;z-index:99";document.body.append(c);
  const x=c.getContext("2d"),p=Array.from({length:120},()=>({x:Math.random()*c.width,y:-20-Math.random()*200,vx:Math.random()*4-2,vy:Math.random()*4+2,s:Math.random()*8+4,c:`hsl(${Math.random()*360} 90% 60%)`}));let f=0;
  (function t(){x.clearRect(0,0,c.width,c.height);p.forEach((q)=>{q.x+=q.vx;q.y+=q.vy;x.fillStyle=q.c;x.fillRect(q.x,q.y,q.s,q.s*.6)});++f<150?requestAnimationFrame(t):c.remove()})();
}
function on(m){
  if(m.type==="error")$("#err").textContent=m.text;
  if(m.type==="auth_fail")localStorage.removeItem("token");
  if(m.type==="auth"){
    me=m.name;localStorage.setItem("token",m.token);rooms=m.rooms;
    $("#login").style.display="none";$("#app").style.display="grid";$("#status").textContent="Connecté";
    if("Notification"in window&&Notification.permission==="default")Notification.requestPermission();
    openRoom(rooms.some((r)=>r.id===cur)?cur:rooms[0].id);
  }
  if(m.type==="rooms"){rooms=m.rooms;side()}
  if(m.type==="users"){online=m.users;side()}
  if(m.type==="history"){store[m.room]=m.messages;if(m.room===cur)draw(true)}
  if(m.type==="message"){
    const x=m.message;(store[x.room]||=[]).push(x);
    if(x.user!==me&&(x.room!==cur||document.hidden)){
      unread[x.room]=(unread[x.room]||0)+1;side();beep();
      if(document.hidden&&Notification.permission==="granted")new Notification(x.user,{body:x.text});
    }
    if(x.room===cur)draw(x.user===me);
    if(x.user===me)typing(false);
  }
  if(m.type==="update"){const a=store[m.message.room];if(a){const i=a.findIndex((z)=>z.id===m.message.id);if(i>=0)a[i]=m.message}if(m.message.room===cur)draw()}
  if(m.type==="remove"){if(store[m.room])store[m.room]=store[m.room].filter((z)=>z.id!==m.id);if(m.room===cur)draw()}
  if(m.type==="typing"&&m.room===cur){$("#typing").textContent=m.user+" est en train d'écrire…";clearTimeout(typeT);typeT=setTimeout(()=>$("#typing").textContent="",2000)}
}
function typing(){$("#typing").textContent=""}
function openRoom(id){cur=id;unread[id]=0;if(!store[id])send({type:"history",room:id});else draw(true);side()}
function side(){
  $("#rooms").replaceChildren(...rooms.map((r)=>h("button",{className:"room"+(r.id===cur?" on":""),onclick:()=>openRoom(r.id)},"# "+r.name,...(unread[r.id]?[h("span",{className:"badge"},String(unread[r.id]))]:[]))));
  $("#count").textContent=online.length;
  $("#users").replaceChildren(...online.map((u)=>h("li",{},av(u),u+(u===me?" (vous)":""))));
  const r=rooms.find((z)=>z.id===cur);$("#title").textContent=r?"# "+r.name:"";
}
const react=(id,e)=>{send({type:"react",id,emoji:e});if(e==="🎉")confetti()};
function msgEl(m){
  const mine=m.user===me,bub=h("div",{className:"msg"});
  const time=new Date(m.time).toLocaleTimeString("fr-FR",{hour:"2-digit",minute:"2-digit"})+(m.edited?" (modifié)":"");
  bub.append(h("div",{className:"meta"},m.user,h("time",{},time)),h("div",{textContent:m.text}));
  const rs=Object.entries(m.reactions||{});
  if(rs.length){const r=h("div",{className:"reacts"});rs.forEach(([e,u])=>r.append(h("button",{className:"chip"+(u.includes(me)?" on":""),title:u.join(", "),onclick:(ev)=>{ev.stopPropagation();react(m.id,e)}},e+" "+u.length)));bub.append(r)}
  const acts=h("div",{className:"acts"});
  EMO.forEach((e)=>acts.append(h("button",{onclick:(ev)=>{ev.stopPropagation();react(m.id,e)}},e)));
  if(mine)acts.append(
    h("button",{title:"Modifier",onclick:(ev)=>{ev.stopPropagation();const t=prompt("Modifier le message",m.text);if(t&&t.trim())send({type:"edit",id:m.id,text:t})}},"✏️"),
    h("button",{title:"Supprimer",onclick:(ev)=>{ev.stopPropagation();if(confirm("Supprimer ce message ?"))send({type:"delete",id:m.id})}},"🗑️"));
  bub.append(acts);bub.onclick=()=>bub.classList.toggle("open");
  const row=h("div",{className:"row"+(mine?" me":"")},av(m.user),bub);row.style.setProperty("--h",hue(m.user));return row;
}
function draw(force){
  const box=$("#messages"),near=box.scrollHeight-box.scrollTop-box.clientHeight<120;
  box.replaceChildren(...(store[cur]||[]).map(msgEl));
  if(force||near)box.scrollTop=box.scrollHeight;
}
$("#lf").onsubmit=(e)=>{e.preventDefault();$("#err").textContent="";
  const go=()=>send({type:e.submitter?.value||"login",name:$("#n").value,password:$("#p").value});
  ws.readyState===1?go():ws.addEventListener("open",go,{once:true})};
$("#composer").onsubmit=(e)=>{e.preventDefault();const t=$("#text").value.trim();if(!t)return;send({type:"message",room:cur,text:t});$("#text").value=""};
$("#text").oninput=()=>{const n=Date.now();if(n-lastTyping>1000){send({type:"typing",room:cur});lastTyping=n}};
$("#newRoom").onclick=()=>{const n=prompt("Nom du nouveau salon");if(n&&n.trim())send({type:"room_new",name:n})};
$("#out").onclick=()=>{localStorage.removeItem("token");location.reload()};
connect();
</script></body></html>
